<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jellygate Bridge</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        color: #111827;
        font-family: Inter, system-ui, sans-serif;
        background: #f8fafc;
      }

      .panel {
        max-width: 720px;
        padding: 24px;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
      }

      input {
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        color: #ffffff;
        font: inherit;
        background: #2563eb;
        cursor: pointer;
      }

      #status {
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Jellygate Bridge</h1>
      <p>
        Configure the Jellygate handoff target that Jellyfin should redirect users to after minting a signed bridge token.
      </p>

      <div class="field">
        <label for="gatewayBaseUrl">Gateway Base URL</label>
        <input id="gatewayBaseUrl" placeholder="https://music.example.com" />
      </div>

      <div class="field">
        <label for="gatewayHandoffPath">Gateway Handoff Path</label>
        <input id="gatewayHandoffPath" placeholder="/auth/handoff" />
      </div>

      <div class="field">
        <label for="sharedSecret">Shared Secret</label>
        <input id="sharedSecret" placeholder="Must match HANDOFF_SECRET in the gateway" type="password" />
      </div>

      <div class="field">
        <label for="tokenLifetimeSeconds">Token Lifetime (seconds)</label>
        <input id="tokenLifetimeSeconds" min="15" type="number" />
      </div>

      <div class="field">
        <label for="defaultReturnPath">Default Return Path</label>
        <input id="defaultReturnPath" placeholder="/" />
      </div>

      <button id="save" type="button">Save</button>
      <div id="status"></div>
    </div>

    <script>
      const endpoint = '/JellygateBridge/config';

      const fields = {
        gatewayBaseUrl: document.getElementById('gatewayBaseUrl'),
        gatewayHandoffPath: document.getElementById('gatewayHandoffPath'),
        sharedSecret: document.getElementById('sharedSecret'),
        tokenLifetimeSeconds: document.getElementById('tokenLifetimeSeconds'),
        defaultReturnPath: document.getElementById('defaultReturnPath')
      };

      const status = document.getElementById('status');
      const save = document.getElementById('save');

      load();
      save.addEventListener('click', submit);

      async function load() {
        const response = await fetch(endpoint, { credentials: 'same-origin' });
        const config = await response.json();
        fields.gatewayBaseUrl.value = config.gatewayBaseUrl || '';
        fields.gatewayHandoffPath.value = config.gatewayHandoffPath || '/auth/handoff';
        fields.sharedSecret.value = config.sharedSecret || '';
        fields.tokenLifetimeSeconds.value = config.tokenLifetimeSeconds || 60;
        fields.defaultReturnPath.value = config.defaultReturnPath || '/';
      }

      async function submit() {
        status.textContent = 'Saving...';

        const response = await fetch(endpoint, {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            gatewayBaseUrl: fields.gatewayBaseUrl.value,
            gatewayHandoffPath: fields.gatewayHandoffPath.value,
            sharedSecret: fields.sharedSecret.value,
            tokenLifetimeSeconds: Number(fields.tokenLifetimeSeconds.value || '60'),
            defaultReturnPath: fields.defaultReturnPath.value || '/'
          })
        });

        status.textContent = response.ok ? 'Saved.' : 'Failed to save configuration.';
      }
    </script>
  </body>
</html>
